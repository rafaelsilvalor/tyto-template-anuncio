name: anuncio
version: 0.9.0
description: A remarketing ad for one exam — its facts at the head and an offer below, one artwork per version, in a feed post and a story.
# Every face the template sets is declared: CircularXX is licensed, so it crosses only under the
# manifest's `font:CircularXX`, approved at install.
faces:
  - { family: CircularXX, weight: 300 }
  - { family: CircularXX, weight: 500 }
  - { family: CircularXX, weight: 700 }
  - { family: CircularXX, weight: 900 }
fonts:
  CircularXX: { alternatives: [Inter, Manrope, DM Sans] }
formats: [grid, story]
slots:
  # The head's layout. Each named variant is a configuration that defaults it; the brief may
  # still write it in the frontmatter. Only `vitrine` is drawn so far.
  cabeca: { type: enum, values: [vitrine, faixa, lateral, manchete, noturna], default: vitrine }
  # The offer's layout, the same way. Only `cartao` is drawn so far.
  oferta: { type: enum, values: [cartao, dupla, lista, chamada, impacto], default: cartao }
  # The head, written once for every artwork, in the shared vocabulary's levels
  # (Tyto docs/slot-vocabulary.md): `|` between the parts of a line, `#` the exam's name, `##`
  # the status before it or the salary after it, `###` a stronger supporting line, an unmarked
  # part a supporting line, or before the name a tracked label; a line of `---` the dots. The
  # first line with no mark is read by position; a later unmarked line is a supporting line.
  # Shared before the slides or after `::comum`; written inside a `::lamina` it is that
  # artwork's own and adds to the shared one there (Tyto ADR 0227): a status line only one
  # artwork carries goes inside that `::lamina`.
  titulo: { type: rich-text, per: lamina, shared: true, required: true, max: 600 }
  # The general information under the title (Tyto docs/slot-vocabulary.md, `corpo`): vacancies,
  # exam board, roles, salary, in the head's levels; a line with no mark is drawn smallest.
  # Shared before the slides or after `::comum`, a slide's own inside a `::lamina` (ADR 0225).
  # Without it, the title draws every line, as 0.4.0 did.
  # Several, each with its own `peso`, named with `{nome: vagas}` and placed per slide by an
  # empty `::corpo {nome: vagas}` (Tyto ADR 0227); a slide's own adds to the shared ones.
  corpo: { type: rich-text, per: lamina, shared: true, multiple: true }
  # One artwork each: the offer version and the timeless one are two `::lamina`. A lamina holds
  # no lines of its own; its blocks follow it. `max` counts artworks.
  lamina: { type: rich-text, repeat: true, min: 1, max: 4 }
  # The panel that calls for attention, drawn as a card shaped by its parts: the line's main
  # part is the band, the parts before it the card's title, the parts after it its foot.
  # `Lote Especial | # Pacotes com 40% OFF` has no foot, so the band takes the bottom corners.
  # A slide's own, or shared by every slide that writes none (ADR 0225).
  apelo: { type: rich-text, per: lamina, shared: true }
  # The proof line, the proof of approvals, say. Written before the first `::lamina`, or after
  # `::comum`, it is every artwork's; written inside a lamina it is that artwork's only, and
  # replaces the shared one there (Tyto ADR 0225). Blocks are drawn in the order the brief writes
  # them: a note after `::comum` goes under the card, one before the slides above it.
  nota: { type: rich-text, per: lamina, shared: true, max: 200 }
  # The head's photograph, full bleed: a building, a stock image or a generated one.
  imagem: { type: image }
  # A teacher cut out with no background, drawn over the photograph. Not drawn yet.
  recorte: { type: image }
# A block's weight (Tyto docs/slot-vocabulary.md, `peso`), 1 to 5 with 3 the designed size:
# `{peso: 1}` draws it at 0.7, `{peso: 2}` at 0.85, `{peso: 4}` at 1.2, `{peso: 5}` at 1.4; the head
# never grows past the width its main line fills.
adjustments:
  peso:
    {
      type: enum,
      values: ['1', '2', '3', '4', '5'],
      default: '3',
      applies: [titulo, corpo, apelo, nota],
    }
# What a configuration may change (Tyto ADR 0153). Each default is the reference's (piece 38 of
# the study); `tests/values.test.ts` pins them equal to the ones the code falls back to.
values:
  # The exam's name, the card's outline and its band.
  destaque: { type: color, default: '#1363d0' }
  # A second and a third highlight, reached only by a colour mark: `{cor:destaque-2}R$ 16 mil{/}`
  # (TYTO-847). Their default is `destaque`'s, so set the one you mark in the frontmatter.
  destaque-2: { type: color, default: '#1363d0' }
  destaque-3: { type: color, default: '#1363d0' }
  # The panel under the words.
  fundo: { type: color, default: '#f7f4f4' }
  # Every word on the panel.
  texto: { type: color, default: '#4d4d4d' }
  # The words on the band.
  texto-faixa: { type: color, default: '#eceaea' }
